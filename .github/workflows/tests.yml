name: Tests

# Runs the unit tests on pull requests and feature branches. Read-only: it never
# commits data or deploys the site (update.yml does that, on main only).
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (no network)
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
