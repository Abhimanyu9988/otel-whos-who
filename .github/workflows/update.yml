name: Update and deploy

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "site/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Always build on the newest main, not the commit that triggered the run:
      # an earlier run may have pushed data since, and runs are queued one at a time.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Fetch sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch.py

      - name: Build data
        run: python scripts/build.py

      - name: Collect PR and issue activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/activity.py

      - name: Count open issues and PRs per component
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/components.py

      - name: Collect merged PRs (author, merger, approvers)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/contributors.py

      - name: Ownership Check (fixed rules, no network)
        run: python scripts/ownership.py

      - name: Commit data if it changed
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes since the last build."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            # main may have moved while the collectors ran (a code push). Data
            # files are only written by this job, so on any overlap keep this
            # run's data (-X theirs = the commit being replayed).
            git pull --rebase -X theirs origin main
            git push
          fi

      - name: Render site
        run: python scripts/render.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
